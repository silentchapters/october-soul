
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Something for an October Soul</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, serif;
      background: #392719;
    }

    .scene {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;

      background-image:
        linear-gradient(
          rgba(35, 22, 12, 0.18),
          rgba(35, 22, 12, 0.25)
        ),
        url("sunset-book.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

   .welcome {
  max-width: 650px;
  width: 100%;
  text-align: center;
  padding: 55px 30px;
  background: transparent;
  border: none;
  box-shadow: none;
}

    .welcome .small {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #291609;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 55px);
      font-weight: normal;
      line-height: 1.3;
      color: #291609;
      margin-bottom: 22px;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.8;
      color: #291609;
      font-style: italic;
    }

    .decoration {
      margin-top: 30px;
      color: #a16b37;
      font-size: 23px;
      letter-spacing: 8px;
    }

    @media (max-width: 600px) {
      .welcome {
        padding: 40px 22px;
      }

      .welcome .small {
        font-size: 11px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
.read-note {
  display: inline-block;
  margin-top: 25px;
  color: #291609;
  font-family: Georgia, serif;
  font-size: 17px;
  text-decoration: none;
  border-bottom: 1px solid #8c572e;
  padding-bottom: 5px;
  transition: opacity 0.3s ease;
}

.read-note:hover {
  opacity: 0.65;
}
  </style>
</head>

<body>

  <main class="scene">

    <section class="welcome">

      <p class="small">A little gift for you</p>

      <h1>
        A Little Something<br>
        for an October Soul
      </h1>

      <p class="subtitle">
        For a friend who deserves<br>
        a little corner of her own.
      </p>

      <div class="decoration">
        ❧ ✦ ❧
      </div>
<a href="letter.html" class="read-note">
  Read your little note →
</a>

    </section>

  </main>

</body>
</html>
